name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.17.2
      - run: ruff check .
      - name: Testes offline (sem OPENROUTER_API_KEY)
        run: pytest -q
      - name: Exemplo em modo mock
        run: python examples/01_offline_mock.py
